<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leave a Message</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Restore the real path after the 404.html SPA redirect (see public/404.html),
    // so a scanned personal QR at sheffmsg.fun/<code> keeps its URL and index.js
    // can read the code. No-op on the local server / normal loads.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
</head>
<body>

  <div id="splash" style="display:none">
    <div id="splashText" class="splash-message">Loading...</div>
  </div>

  <main class="container hidden">
    <h1 class="site-title">Previous Message:</h1>
    
    <section class="message-box">
      <div id="currentMessage" class="current-message">No previous message found :(</div>
      <div id="timestamp" class="timestamp">Message created at: </div>
    </section>

    <section class="form-section">
      <form id="messageForm">
        <h1 class="site-title">Leave a message for the next person who finds this qr</h1>
        <textarea id="messageInput" maxlength="100" placeholder="Type your message..." required></textarea>

        <div class="controls control-column">
          <div class="control">
            <div class="label">Background</div>
            <div class="swatches" id="bgSwatches"></div>
          </div>

          <div class="control">
            <label class="label" for="fontSelect">Font</label>
            <select id="fontSelect" class="styled-select">
              <option value="system-ui">System</option>
              <option value="Georgia">Georgia</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Arial">Arial</option>
              <option value="monospace">Monospace</option>
              <option value="cursive">Cursive</option>
            </select>
          </div>

          <div class="control">
            <label class="label" for="sizeSelect">Text size</label>
            <select id="sizeSelect" class="styled-select">
              <option value="small">Small</option>
              <option value="medium" selected>Medium</option>
              <option value="large">Large</option>
            </select>
          </div>

          <div class="control">
            <label class="label">Inspiration (Or just say whatever you want)</label>
            <div class="inspiration-container">
              <input type="text" id="inspo" class="styled-input" readonly value="Tell your best joke" aria-label="Inspiration prompt">
              <button type="button" id="refreshInspo" class="refresh-btn" aria-label="Get new inspiration">🔄</button>
            </div>
          </div>

        </div>

        <button type="submit">Submit</button>
        <div id="formStatus" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section id="viewAllSection" class="view-all-section">
      <a href="/messages.html" class="view-all-btn">View All Messages</a>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/spread" class="footer-link">Help spread the cause</a>
  </footer>

  <script src="/index.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
</body>
</html>
